[project]
name = "jev-false-success-eval"
version = "0.1.0"
description = "Private, reproducible evaluation harness for false-success detection in tool-using agent traces."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "httpx>=0.27,<0.29",
    "typer>=0.12,<0.16",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.6,<2",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<0.14",
    "pyyaml>=6,<7",
    "fastapi>=0.115,<0.121",
    "uvicorn>=0.30,<0.40",
    "xgboost>=2.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<0.15",
    "mypy>=1.10,<2",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6",
]

[project.scripts]
jev-eval = "false_success_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/false_success_eval"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = []

[[tool.mypy.overrides]]
module = ["sklearn.*", "seaborn.*", "matplotlib.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: tests that require network access and credentials (never run by default)",
]
